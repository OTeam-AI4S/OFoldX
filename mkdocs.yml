site_name: OFoldX
site_url: https://ofoldx.valhalla.technology/
site_author: OFoldX Contributors
site_description: Fold molecules, unfold possibilities. Open biomolecular models for prediction and design.
copyright: All rights reserved &copy; 2026-Present, OFoldX Contributors
docs_dir: docs
site_dir: build/docs
exclude_docs: |
  /generate_docs.py
  /site/
  /__pycache__/
  /requirements.txt

repo_name: OTeam-AI4S/OFoldX
repo_url: https://github.com/OTeam-AI4S/OFoldX

hooks:
  - docs/generate_docs.py

nav:
  - Home: index.md
  - About:
      - License: about/license.md
      - License FAQ: about/license-faq.md
      - Privacy Notice: about/privacy.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Noto Sans
    code: Noto Sans Mono

extra:
  analytics:
    provider: google
    property: "G-LPXXJRLEQ7"
  consent:
    title: Cookie Consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better. Please check out our
      <a href="https://ofoldx.valhalla.technology/about/privacy/">Privacy Notice</a> for more information.
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OTeam-AI4S/OFoldX
      name: OFoldX on GitHub
    - icon: fontawesome/solid/face-smile
      link: https://huggingface.co/oteam
      name: OTeam on Hugging Face

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - callouts
  - def_list
  - footnotes
  - markdown_gfm_admonition
  - md_in_html
  - mdx_math
  - meta
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - smarty
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      separator: '[\s\u200b\-]'
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          build: true
          default: true
          name: English
        - locale: zh
          build: true
          name: 中文
      reconfigure_material: true
      reconfigure_search: true
  - section-index
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            members_order: source
            parameter_headings: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            scoped_crossrefs: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://pytorch.org/docs/stable/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://chanfig.danling.org/objects.inv
            - https://danling.org/objects.inv
watch:
  - ofoldx/
  - README.md
  - README.zh.md
  - license.md
  - license.zh.md
  - license-faq.md
  - license-faq.zh.md
  - privacy.md
  - privacy.zh.md
