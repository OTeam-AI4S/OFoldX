[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
  "setuptools-scm",
]

[project]
name = "ofoldx"
description = "Open biomolecular structure models for prediction, scoring, and design"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = [ "LICENSE.md" ]
keywords = [
  "biomolecular-design",
  "deep-learning",
  "dna",
  "machine-learning",
  "protein",
  "rna",
]
maintainers = [
  { name = "Zhiyuan Chen", email = "this@zyc.ai" },
]
authors = [
  { name = "Zhiyuan Chen", email = "this@zyc.ai" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = [
  "version",
]
dependencies = [
  "biotite>=1.7",
  "chanfig",
  "chembl_structure_pipeline",
  "danling>=0.4.2",
  "huggingface-hub>=0.24.0",
  "multimolecule>=0.2.0",
  "numpy",
  "rdkit",
  "safetensors>=0.2.8",
  "scipy",
  "torch",
  "typing-extensions>=4.0",
  "zstandard",
]
urls.homepage = "https://github.com/OTeam-AI4S/OFoldX"
urls.issues = "https://github.com/OTeam-AI4S/OFoldX/issues"
urls.repository = "https://github.com/OTeam-AI4S/OFoldX"
[project.optional-dependencies]
oops = [
  "ooperators",
]

[tool.setuptools]
packages.find.include = [ "ofoldx*" ]

[tool.setuptools.package-data]
"ofoldx.models.rfdiffusion" = [ "rfdiffusion_schedule.npz" ]

[tool.setuptools_scm]
write_to = "ofoldx/_version.py"

[tool.black]
line-length = 120
workers = 1

[tool.isort]
line_length = 120
profile = "black"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

[tool.pytest]
ini_options.addopts = "--import-mode=importlib --doctest-modules --cov=ofoldx"
ini_options.markers = [
  "lfs: tests that involve large file handling and should be excluded from CI",
]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
run.source = [ "ofoldx" ]
paths.source = [ "ofoldx", "*/site-packages/ofoldx" ]
report.fail_under = 60
report.omit = [ "ofoldx/models/*/convert.py" ]
report.show_missing = true
json.output = "coverage.json"
xml.output = "coverage.xml"
