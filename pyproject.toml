[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
  "setuptools-scm",
]

[project]
name = "ofoldx"
description = "Open biomolecular structure models for prediction, scoring, and design"
readme = "README.md"
keywords = [
  "biomolecular-design",
  "deep-learning",
  "dna",
  "machine-learning",
  "protein",
  "rna",
]
license = "AGPL-3.0-or-later"
license-files = [ "LICENSE.md" ]
maintainers = [
  { name = "Zhiyuan Chen", email = "z@valtech.ai" },
]
authors = [
  { name = "Zhiyuan Chen", email = "z@valtech.ai" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = [
  "version",
]
dependencies = [
  "abnumber>=0.4.4",
  "anarci>=2026.2.13.2",
  "biotite>=1.7",
  "chanfig",
  "chembl-structure-pipeline",
  "danling>=0.4.2",
  "huggingface-hub>=0.24",
  "multimolecule>=0.2",
  "numpy",
  "pyarrow",
  "rdkit",
  "safetensors>=0.2.8",
  "scipy",
  "torch",
  "transformers",
  "typing-extensions>=4",
  "zstandard",
]
optional-dependencies.oops = [
  "ooperators",
]
urls.homepage = "https://github.com/OTeam-AI4S/OFoldX"
urls.issues = "https://github.com/OTeam-AI4S/OFoldX/issues"
urls.repository = "https://github.com/OTeam-AI4S/OFoldX"

[tool.setuptools]
packages.find.include = [ "ofoldx*" ]

[tool.setuptools.package-data]
ofoldx = [ "models/rfdiffusion/rfdiffusion_schedule.npz" ]

[tool.setuptools_scm]
write_to = "ofoldx/_version.py"

[tool.black]
line-length = 120
workers = 1

[tool.isort]
line_length = 120
profile = "black"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"

[tool.pytest]
ini_options.addopts = "--import-mode=importlib --doctest-modules --cov=ofoldx"
ini_options.testpaths = [ "ofoldx", "tests" ]

[tool.coverage]
run.branch = true
run.source = [ "ofoldx" ]
paths.source = [ "ofoldx" ]
report.fail_under = 60
report.omit = [ "ofoldx/models/*/convert.py" ]
report.show_missing = true
json.output = "coverage.json"
xml.output = "coverage.xml"
