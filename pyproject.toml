[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools",
  "setuptools-scm",
]

[project]
name = "ofoldx"
description = "Everything biomolecular interactions"
readme = "README.md"
keywords = [
  "biomolecular-design",
  "deep-learning",
  "dna",
  "machine-learning",
  "protein",
  "rna",
]
maintainers = [
  { name = "Zhiyuan Chen", email = "this@zyc.ai" },
]
authors = [
  { name = "Zhiyuan Chen", email = "this@zyc.ai" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = [
  "version",
]
dependencies = [
  "biotite",
  "chanfig",
  "danling>=0.4.1",
  "huggingface-hub",
  "numpy",
  "rdkit",
  "safetensors",
  "scipy",
  "torch",
  "zstandard",
]
urls.homepage = "https://github.com/OTeam-AI4S/OFoldX"
urls.issues = "https://github.com/OTeam-AI4S/OFoldX/issues"
urls.repository = "https://github.com/OTeam-AI4S/OFoldX"
scripts.oevaluate = "ofoldx.api.run:evaluate"
scripts.ofoldx = "ofoldx.api.cli:main"
scripts.oinfer = "ofoldx.api.run:infer"
scripts.otrain = "ofoldx.api.run:train"
ptional-dependencies.oops = [
  "ooperators",
]

[tool.setuptools]
packages.find.include = [ "ofoldx*" ]

[tool.setuptools_scm]
write_to = "ofoldx/_version.py"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

[tool.pytest]
ini_options.addopts = "--doctest-modules --cov=ofoldx"
ini_options.markers = [
  "lfs: tests that involve large file handling and should be excluded from CI",
]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
run.source = [ "ofoldx" ]
paths.source = [ "ofoldx", "*/site-packages/ofoldx" ]
report.fail_under = 60
report.omit = [ "ofoldx/models/*/convert.py" ]
report.show_missing = true
json.output = "coverage.json"
xml.output = "coverage.xml"
