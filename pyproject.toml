[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools",
  "setuptools-scm",
]

[project]
name = "allodesign"
description = "Everything biomolecular interactions"
keywords = [
  "biomolecular-design",
  "deep-learning",
  "dna",
  "machine-learning",
  "protein",
  "rna",
]
maintainers = [
  { name = "Zhiyuan Chen", email = "this@zyc.ai" },
]
authors = [
  { name = "Zhiyuan Chen", email = "this@zyc.ai" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = [
  "version",
]
dependencies = [
  "chanfig",
  "danling",
  "oops",
  "safetensors",
  "torch",
]
urls.homepage = "https://github.com/OTeam-AI4S/AlloDesign"
urls.issues = "https://github.com/OTeam-AI4S/AlloDesign/issues"
urls.repository = "https://github.com/OTeam-AI4S/AlloDesign"

[tool.setuptools]
packages.find.include = [ "allodesign*" ]

[tool.setuptools_scm]
write_to = "allodesign/_version.py"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.flake8]
max-line-length = 120

[tool.pylint]
format.max-line-length = 120
main.fail-under = 9.8
messages_control.disable = """
  E0012,
  E0401,
  R0201,
  R0801,
"""
reports.output-format = "colorized"

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"

[tool.pytest]
ini_options.addopts = "--doctest-modules --cov=allodesign"
ini_options.markers = [
  "lfs: tests that involve large file handling and should be excluded from CI",
]

[tool.coverage]
run.branch = true
run.source = [ "allodesign" ]
paths.source = [ "allodesign", "*/site-packages/allodesign" ]
report.fail_under = 64
report.show_missing = true
json.output = "coverage.json"
xml.output = "coverage.xml"
