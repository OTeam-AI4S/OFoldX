name: push

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Install package
        run: python -m pip install -e .
      - name: Build documentation
        run: python -m mkdocs build --strict -f docs/mkdocs.yml
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "true"
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.repository == 'OTeam-AI4S/OFoldX' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install HMMER
        run: sudo apt-get update && sudo apt-get install -y hmmer
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-cov markdown PyYAML
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest --cov=ofoldx --cov-report=xml ofoldx tests
      - name: Upload coverage reports to Codecov
        if: >-
          matrix.python-version == '3.14' &&
          github.repository == 'OTeam-AI4S/OFoldX' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload coverage reports to Codacy
        if: >-
          matrix.python-version == '3.14' &&
          github.repository == 'OTeam-AI4S/OFoldX' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, docs]
    outputs:
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY_RELEASE'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile
          from packaging.version import Version

          expected = Version(os.environ["RELEASE_TAG"].removeprefix("v"))
          if expected.is_devrelease or expected.local is not None:
              raise ValueError("release tags must not select development or local versions")
          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          with ZipFile(wheel) as archive:
              metadata, = (name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              wheel_metadata = BytesParser().parsebytes(archive.read(metadata))
          with open_tar(sdist) as archive:
              metadata, = (member for member in archive.getmembers() if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1)
              with archive.extractfile(metadata) as stream:
                  sdist_metadata = BytesParser().parsebytes(stream.read())
          for metadata in (wheel_metadata, sdist_metadata):
              if metadata["Name"] != "ofoldx" or Version(metadata["Version"]) != expected:
                  raise ValueError(f"tag/package mismatch: {metadata['Name']} {metadata['Version']} != {expected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"prerelease={str(expected.is_prerelease).lower()}", file=output)
          PY_RELEASE
      - name: Installed-wheel smoke test
        run: |
          python -m venv /tmp/ofoldx-smoke
          /tmp/ofoldx-smoke/bin/python -m pip install -U pip
          /tmp/ofoldx-smoke/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/ofoldx-smoke/bin/python -m pip install dist/*.whl
          ofoldx_smoke_dir=$(mktemp -d)
          cd "$ofoldx_smoke_dir"
          /tmp/ofoldx-smoke/bin/python -I -m ofoldx.reference.ccd --help
          /tmp/ofoldx-smoke/bin/python -I -m ofoldx.reference.ccd build \
            --source "$GITHUB_WORKSPACE/tests/fixtures/ccd/components_subset.cif.gz" \
            --content-version ci-subset --output "$ofoldx_smoke_dir/ccd"
          /tmp/ofoldx-smoke/bin/python -I - <<'PY_SMOKE'
          import os
          from importlib.resources import files
          from pathlib import Path
          from ofoldx import AutoModel, AutoProcessor
          from ofoldx.chemistry.definitions import load_library
          from ofoldx.conversion import save_repository
          from ofoldx.hub import resolve_hub_repository

          package = files("ofoldx")
          for resource in ("reference/space_groups/space_group_operators.json", "licenses/license.md", "licenses/license-faq.md"):
              assert package.joinpath(resource).is_file(), resource
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "ofoldx"
          for card in (source / "models").glob("*/README.md"):
              relative = card.relative_to(source).as_posix()
              assert package.joinpath(relative).is_file(), relative
          assert all(callable(api) for api in (AutoModel, AutoProcessor, save_repository, resolve_hub_repository))
          assert load_library(Path("ccd/components.safetensors")).definition("ALA") is not None
          PY_SMOKE
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'OTeam-AI4S/OFoldX'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ofoldx
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            release_flags=(--verify-tag --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* "${release_flags[@]}" --repo "$GITHUB_REPOSITORY"
          fi

  pages:
    if: github.event_name == 'push' && github.repository == 'OTeam-AI4S/OFoldX' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
