name: push

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-cov
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest -m "not lfs" --cov=ofoldx --cov-report=xml .

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Clean-import smoke test
        run: |
          python -m venv /tmp/ofoldx-smoke
          /tmp/ofoldx-smoke/bin/python -m pip install -U pip
          /tmp/ofoldx-smoke/bin/python -m pip install dist/*.whl
          /tmp/ofoldx-smoke/bin/python -c "import ofoldx"
