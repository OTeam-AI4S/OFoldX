[flake8]
max-line-length = 120
ignore = E203,E704,W503
# __init__.py files are pure re-export hubs; per DESIGN §10.2 the public surface is
# expressed by module locations + reexports (no __all__), so F401 there is a re-export, not dead code.
per-file-ignores =
    __init__.py:F401

[pycodestyle]
count = True
statistics = True
max-line-length = 120
