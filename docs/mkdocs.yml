site_name: OFoldX
site_url: https://oteam-ai4s.github.io/OFoldX/
site_author: OFoldX Contributors
site_description: Open biomolecular structure models for prediction, scoring, and design
copyright: All rights reserved &copy; 2026-Present, OFoldX Contributors

repo_name: OTeam-AI4S/OFoldX
repo_url: https://github.com/OTeam-AI4S/OFoldX

hooks:
  - gen_pages.py

nav:
  - Home: index.md
  - Models: []
  - Pipelines: []
  - Task API: []
  - Data: []
  - I/O: []
  - Modules: []
  - Results: []
  - Runners: []
  - API Reference: []
  - License: about/license.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    text: Noto Sans
    code: Noto Sans Mono

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OTeam-AI4S/OFoldX
      name: OFoldX on GitHub
    - icon: fontawesome/solid/face-smile
      link: https://huggingface.co/oteam
      name: OTeam on Hugging Face

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - callouts
  - def_list
  - footnotes
  - markdown_gfm_admonition
  - md_in_html
  - mdx_math
  - meta
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      auto_title: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - smarty
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      separator: '[\s\u200b\-]'
  - section-index
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: source
            parameter_headings: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            scoped_crossrefs: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://pytorch.org/docs/stable/objects.inv
            - https://numpy.org/doc/stable/objects.inv
            - https://chanfig.danling.org/objects.inv
            - https://danling.org/objects.inv
watch:
  - ../ofoldx/
  - ../README.md
  - ../LICENSE.md

exclude_docs: |
  .gitkeep
